name: Sync version with upstream
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sync-candidate:
    name: 🔄 Sync version with upstream
    environment: "Candidate Branch"
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Sync version with upstream
        uses: snapcrafters/ci/sync-version@main
        with:
          token: ${{ secrets.SNAPCRAFTERS_BOT_COMMIT }}
          update-script: |
            set -euo pipefail

            VERSION=$(
              curl -fsSL "https://api.github.com/repos/arduino/Arduino/releases/latest" |
                jq -er '.tag_name | ltrimstr("v") | select(test("^1\\.[0-9]+\\.[0-9]+$"))'
            )
            sed -i "s/^version: .*/version: $VERSION/" snapcraft.yaml

  sync-2:
    name: Sync IDE 2 version with upstream
    environment: "2 Branch"
    runs-on: ubuntu-latest
    steps:
      - name: Sync IDE 2 version with upstream
        uses: snapcrafters/ci/sync-version@main
        with:
          branch: "2"
          token: ${{ secrets.SNAPCRAFTERS_BOT_COMMIT }}
          update-script: |
            set -euo pipefail

            # Refuse the legacy recipe until the IDE 2 migration is merged.
            grep -q '^version: 2\.' snapcraft.yaml
            RELEASE=$(curl -fsSL "https://api.github.com/repos/arduino/arduino-ide/releases/latest")
            VERSION=$(jq -er '.tag_name | select(test("^2\\.[0-9]+\\.[0-9]+$"))' <<< "$RELEASE")
            CHECKSUM=$(jq -er --arg name "arduino-ide_${VERSION}_Linux_64bit.zip" '
              [.assets[] | select(.name == $name) | .digest] |
              select(length == 1) | .[0] |
              select(test("^sha256:[0-9a-f]{64}$")) | sub("^sha256:"; "sha256/")
            ' <<< "$RELEASE")
            sed -i -e "s/^version: .*/version: $VERSION/" \
              -e "s|^    source-checksum: .*|    source-checksum: $CHECKSUM|" snapcraft.yaml
