name: 🧪 Test snap can be built on x86_64

on:
  push:
    branches: [ candidate ]
  pull_request:
    branches: [ candidate ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build and review snap on amd64
        uses: snapcrafters/ci/test-snap-build@main
        with:
          snapcraft-channel: latest/stable
