name: Promote to Stable
on:
  issue_comment:
    types: [ created ]
permissions:
  issues: write
jobs:
  promote-latest:
    name: 🚀 Promote to stable
    runs-on: ubuntu-latest
    environment: "Candidate Branch"
    if: |
      ( !github.event.issue.pull_request )
      && contains(github.event.comment.body, '/promote ')
      && contains(github.event.comment.body, 'latest/stable')
      && contains(github.event.issue.body, 'latest/stable')
      && contains(github.event.*.labels.*.name, 'testing')
    steps:
      - name: 🚀 Promote to stable
        uses: snapcrafters/ci/promote-to-stable@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          store-token: ${{ secrets.SNAP_STORE_STABLE }}

  promote-2:
    name: 🚀 Promote to 2/stable
    runs-on: ubuntu-latest
    environment: "2 Branch"
    if: |
      ( !github.event.issue.pull_request )
      && contains(github.event.comment.body, '/promote ')
      && contains(github.event.comment.body, '2/stable')
      && contains(github.event.issue.body, '2/stable')
      && contains(github.event.*.labels.*.name, 'testing')
    steps:
      - name: 🚀 Promote to 2/stable
        uses: snapcrafters/ci/promote-to-stable@main
        with:
          channel: 2/stable
          github-token: ${{ secrets.GITHUB_TOKEN }}
          store-token: ${{ secrets.SNAP_STORE_STABLE }}
