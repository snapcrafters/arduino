name: arduino
title: Arduino IDE
version: 2.3.11
summary: Write code and upload it to your Arduino-compatible board.
description: |
  Arduino IDE is an open-source editor for writing sketches and uploading
  them to Arduino-compatible boards. It includes code completion, a debugger,
  and tools for managing boards and libraries.

  Snap interfaces grant confinement access; host device ownership, mode bits,
  groups and ACLs remain separate. On Ubuntu, serial devices commonly use
  dialout, but this is not universal. If your device requires it, run:

      sudo usermod -a -G dialout "$USER"

  Log out and back in after group changes. Follow board/vendor-specific udev
  instructions when required; do not install a blanket USB rule.

  For USB device access, including USB serial devices such as ttyUSB/ttyACM,
  connect raw-usb. For sketches on removable drives, connect removable-media:

      sudo snap connect arduino:raw-usb
      sudo snap connect arduino:removable-media

  Use only the connections you need. For parallel snap instances, replace
  arduino in commands and paths with the instance name (SNAP_INSTANCE_NAME
  inside the snap). serial-port can be useful with a suitable specific slot;
  it is not a universal extra connection requirement. Missing raw-usb does
  not block every upload workflow; connection state does not certify board access.

  Ordinary GUI startup and sketch-file launches offer missing connections with
  Recheck, Continue, Don't ask again, and Cancel. Commands are selectable for
  copying into a terminal; onboarding does not run them or change host settings.
  Headless launches and option-bearing invocations skip onboarding, except for
  the fixed --no-sandbox option. Query or dialog errors warn and continue;
  Cancel or closing the dialog aborts this launch.

  Don't ask again saves SNAP_USER_COMMON/dont-ask-interfaces. To reset it for
  the default instance, run:

      rm "$HOME/snap/arduino/common/dont-ask-interfaces"

  The old IDE 1 dont-warn-permissions marker is not migrated or used to suppress
  this interface prompt. Select Don't ask again to opt out of the new prompt.

  If a mounted drive is absent from the file chooser sidebar, browse to its
  mount point under /media, /mnt or /run/media. This sidebar workaround is
  separate from the connection granting filesystem access.

  The separate arduino.cli and arduino.pip commands skip onboarding.

  Python 3 and pyserial are included for board tools such as ESP8266.
  Additional Python libraries can be installed inside the snap with:

      arduino.pip install requests

license: AGPL-3.0-or-later
icon: snap/gui/arduino.png
grade: stable
base: core26
confinement: strict
compression: lzo

platforms:
  amd64:

environment:
  PATH: $SNAP_USER_DATA/.local/bin:$SNAP/bin:$PATH

apps:
  arduino:
    extensions: [gnome]
    command: arduino-ide --no-sandbox
    command-chain: [bin/interface-onboarding]
    plugs:
      - home
      - removable-media
      - network
      - network-bind
      - serial-port
      - raw-usb
      - browser-support
      - audio-playback
  cli:
    command: resources/app/lib/backend/resources/arduino-cli
    plugs:
      - home
      - removable-media
      - network
      - network-bind
      - serial-port
      - raw-usb
  pip:
    command: bin/python3 -m pip
    environment:
      PIP_USER: '1'
      PIP_BREAK_SYSTEM_PACKAGES: '1'
      PIP_PYTHON: /snap/$SNAP_INSTANCE_NAME/current/bin/python3
    plugs: [network]

parts:
  interface-onboarding:
    plugin: dump
    source: snap/local
    stage-packages: [yad]

  # core26's df resolves outside snapd's allowed base executable paths.
  df:
    plugin: nil
    stage-packages: [gnu-coreutils]
    organize:
      usr/bin/gnudf: bin/df
    stage: [bin/df]

  arduino:
    plugin: dump
    source: https://github.com/arduino/arduino-ide/releases/download/$SNAPCRAFT_PROJECT_VERSION/arduino-ide_${SNAPCRAFT_PROJECT_VERSION}_Linux_64bit.zip
    source-subdir: arduino-ide_${SNAPCRAFT_PROJECT_VERSION}_Linux_64bit
    source-checksum: sha256/1e009f3c720092e6fae4e71809e0b755058e8c5d59eac7548b288d4f42b5e9b1
    # Keep Python native modules outside the GNOME cleanup's usr/lib paths.
    organize:
      usr: .
    stage-packages:
      - libnss3
      - libusb-0.1-4  # Legacy uploaders such as Micronucleus need this ABI (#13).
      - libxkbfile1
      - usbutils
      - python-is-python3
      - python3-serial
      - python3-pip
