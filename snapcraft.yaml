# name: arduino-mhall119   # uncomment for arduino-mhall119 builds
name: arduino
title: Arduino IDE
version: 1.8.19
summary: Write code and upload it to your Arduino-compatible board.
description: |
  Arduino is an open-source physical computing platform based on a simple I/O board and a development environment that implements the Processing/Wiring language. Arduino can be used to develop stand-alone interactive objects or can be connected to software on your computer (e.g. Flash, Processing and MaxMSP). The boards can be assembled by hand or purchased preassembled at https://arduino.cc

  Snap interfaces grant confinement access; host device ownership, mode bits,
  groups and ACLs remain separate. On Ubuntu, serial devices commonly use
  dialout, but this is not universal. If your device requires it, run:

      sudo usermod -a -G dialout "$USER"

  Log out and back in after group changes. Follow board/vendor-specific udev
  instructions when required; do not install a blanket USB rule.

  For USB device access, including USB serial devices such as ttyUSB/ttyACM,
  connect raw-usb. For sketches on removable drives, connect removable-media:

      sudo snap connect arduino:raw-usb
      sudo snap connect arduino:removable-media

  Use only the connections you need. For parallel snap instances, replace
  arduino in commands and paths with the instance name (SNAP_INSTANCE_NAME
  inside the snap). serial-port can be useful with a suitable specific slot;
  it is not a universal extra connection requirement. Missing raw-usb does
  not block every upload workflow; connection state does not certify board access.

  Ordinary GUI startup and sketch-file launches offer missing connections with
  Recheck, Continue, Don't ask again, and Cancel. Commands are selectable for
  copying into a terminal; onboarding does not run them or change host settings.
  Headless launches and option-bearing invocations skip onboarding, except for
  the fixed --no-sandbox option. Query or dialog errors warn and continue;
  Cancel or closing the dialog aborts this launch.

  Don't ask again saves SNAP_USER_COMMON/dont-ask-interfaces. To reset it for
  the default instance, run:

      rm "$HOME/snap/arduino/common/dont-ask-interfaces"

  The old IDE 1 dont-warn-permissions marker is not migrated or used to suppress
  this interface prompt. Select Don't ask again to opt out of the new prompt.

  If a mounted drive is absent from the file chooser sidebar, browse to its
  mount point under /media, /mnt or /run/media. This sidebar workaround is
  separate from the connection granting filesystem access.

  The separate arduino.pip command skips onboarding.

  **Python 3 support**

  This version of Arduino IDE runs in a sandbox for improved security and stability. As a result, it does not have access to the Python libraries on your device.

  Python 3 and the `serial` library are installed inside of the sandbox so they can be used by plugins. If a plugin needs additional Python 3 libraries, you can install them using the `arduino.pip` command. For example, the following command installs the `requests` library inside of the sandbox so the Arduino IDE can use it.

  > `arduino.pip install requests`

  Python 2 is currently not supported in this package because it reached end of life on January 1st 2020. If you have hardware that _requires_ Python 2 support, please let us know.
  
  **Are you having issues?**

  Let us know by creating a new issue here: https://github.com/snapcrafters/arduino/issues 
license: GPL-2.0
icon: snap/gui/arduino.png
grade: stable

base: core26
confinement: strict
compression: lzo      # improves startup time for large snaps

platforms:
  amd64:
  armhf:
  arm64:

environment:
  PATH: $SNAP/bin:$PATH

apps:
  arduino:
    extensions:
      - gnome
    command: arduino-snap
    command-chain:
      - set-environment
      - interface-onboarding
      # - warn-unsupported  # uncomment for arduino-mhall119 builds
    environment:
      # Fallback to XWayland if running in a Wayland session.
      DISABLE_WAYLAND: 1
    plugs:
      - unity7
      - home
      - removable-media
      - network
      - serial-port
      - raw-usb
      - network-bind  # For OTA updates      
  pip:
    command: bin/python3 -m pip
    command-chain:
      - set-environment
    environment:
      PIP_USER: '1'
      PIP_BREAK_SYSTEM_PACKAGES: '1'
    plugs:
      - network

parts:
  upstream:
    source: https://github.com/arduino/Arduino/releases/download/$SNAPCRAFT_PROJECT_VERSION/arduino-$SNAPCRAFT_PROJECT_VERSION.tar.xz
    source-type: tar
    plugin: nil
    build-packages:
      - ant
      - openjdk-11-jdk
    build-environment:
      - JAVA_HOME: /usr/lib/jvm/java-11-openjdk-$CRAFT_ARCH_BUILD_FOR
    override-build: |
      # Ant's Java downloader needs system properties for the builder's proxy.
      proxy="${http_proxy:-${HTTP_PROXY:-${https_proxy:-${HTTPS_PROXY:-}}}}"
      if [ -n "$proxy" ]; then
        proxy="${proxy#*://}"
        proxy="${proxy%%/*}"
        proxy_host="${proxy%:*}"
        proxy_port="${proxy##*:}"
        [ "$proxy_host" != "$proxy_port" ] || proxy_port=80
        export ANT_OPTS="${ANT_OPTS:+$ANT_OPTS }-Dhttp.proxyHost=$proxy_host -Dhttp.proxyPort=$proxy_port -Dhttps.proxyHost=$proxy_host -Dhttps.proxyPort=$proxy_port"
      fi
      ant -f build/build.xml
      cp -a build/linux/work/. "$CRAFT_PART_INSTALL/"
      ln -s usr/lib/jvm/java-11-openjdk-$CRAFT_ARCH_BUILD_FOR "$CRAFT_PART_INSTALL/java"
    stage-packages:
      - openjdk-11-jre
      - libusb-0.1-4
      - usbutils

  launcher:
    plugin: dump
    source: scripts
    stage-packages:
      - yad

  dark-arduino-theme:
    plugin: dump
    source: https://github.com/jeffThompson/DarkArduinoTheme.git
    build-packages:
      - zip
    override-build: |
      craftctl default
      mkdir -p $CRAFT_PART_INSTALL/lib/theme/
      cd theme
      zip -r $CRAFT_PART_INSTALL/lib/theme/dark-arduino-theme.zip *
    stage:
      - lib/theme/dark-arduino-theme.zip

  # Python 3 is required for certain plugins and they expect python to point to python3.
  # See https://github.com/snapcrafters/arduino/issues/5
  python3:
    plugin: nil
    # Preserve native modules against GNOME's usr/lib Python cleanup.
    organize:
      usr: .
    stage-packages:
      - python-is-python3
      - python3-serial
      - python3-pip
